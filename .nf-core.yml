repository_type: pipeline

nf_core_version: 4.0.2

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-magma_logo_light.png
    - docs/images/nf-core-magma_logo_light.png
    - docs/images/nf-core-magma_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
    - validation.help.beforeText
    - validation.help.afterText
    - validation.summary.beforeText
    - validation.summary.afterText
  multiqc_config:
    - report_comment
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - CODE_OF_CONDUCT.md
    - assets/nf-core-magma_logo_light.png
    - docs/images/nf-core-magma_logo_light.png
    - docs/images/nf-core-magma_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml

template:
  org: TORCH-consortium
  name: MAGMA
  description: A pipeline for comprehensive genomic analyses of Mycobacterium tuberculosis
    with a focus on clinical decision making as well as research.
  author: Tim H. Heupink*  , Lennert Verboven* , Abhinav Sharma* , Vincent Rennie,
    Miguel de Diego Fuertes, Robin M. Warren, Annelies Van Rie
  version: 3.0.0dev
  force: true
  outdir: .
  skip_features:
    - igenomes
  is_nfcore: false
